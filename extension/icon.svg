<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" opacity="0.3" filter="blur(4)"/>

  <!-- Left angle bracket -->
  <path d="M50 34L22 64L50 94" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket -->
  <path d="M78 34L106 64L78 94" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center: annotation crosshair/target -->
  <circle cx="64" cy="64" r="16" fill="url(#dot)" stroke="#fff" stroke-width="3"/>
  <circle cx="64" cy="64" r="6" fill="#fff"/>
</svg>
