<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; margin: 0; background: #111827; color: #f9fafb; }
    h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .status { font-size: 13px; color: #9ca3af; margin: 0 0 8px; }
    #mic-status { font-size: 11px; margin: 0 0 12px; }
    .mic-ok { color: #34d399; }
    .mic-denied { color: #f87171; }
    .mic-prompt { color: #fbbf24; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; margin: 4px 0; }
    .primary { background: #3b82f6; color: white; }
    .primary:hover { background: #2563eb; }
    .danger { background: #7f1d1d; color: #fca5a5; }
    .danger:hover { background: #991b1b; }
    .link-row { margin-top: 8px; text-align: center; }
    .link-row a { color: #60a5fa; font-size: 12px; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
    .shortcuts { width: 100%; font-size: 11px; color: #9ca3af; margin-top: 12px; border-collapse: collapse; }
    .shortcuts td { padding: 2px 0; }
    .shortcuts td:first-child { width: 58px; }
    .shortcuts .group td { color: #6b7280; padding-top: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .customize { display: block; margin-top: 8px; font-size: 11px; color: #6b7280; }
    kbd { background: #1f2937; padding: 1px 5px; border-radius: 3px; border: 1px solid #374151; font-size: 10px; font-family: inherit; color: #d1d5db; }
  </style>
</head>
<body>
  <h2>Webapp Reviewer</h2>
  <p id="status" class="status">Click to activate on current page</p>
  <p id="mic-status"></p>
  <button id="toggle" class="primary">Start Review</button>
  <div class="link-row"><a id="view-reviews" href="http://localhost:10002/reviews" target="_blank">View all reviews</a></div>
  <table class="shortcuts">
    <tr><td><kbd>Alt+R</kbd></td><td>Start / stop review</td></tr>
    <tr><td><kbd>Alt+S</kbd></td><td>Screenshot</td></tr>
    <tr class="group"><td colspan="2">During a review</td></tr>
    <tr><td><kbd>Alt+E</kbd></td><td>Select element and add a note</td></tr>
    <tr><td><kbd>Alt+D</kbd></td><td>Draw</td></tr>
    <tr><td><kbd>Alt+N</kbd></td><td>Timeline</td></tr>
    <tr><td><kbd>Alt+X</kbd></td><td>Export and end, copies path</td></tr>
    <tr><td><kbd>?</kbd></td><td>All shortcuts</td></tr>
    <tr><td>Click</td><td>Point at an element while talking</td></tr>
  </table>
  <a class="customize" id="customize" href="#">Change Alt+R / Alt+S</a>
  <script src="popup.js"></script>
</body>
</html>
